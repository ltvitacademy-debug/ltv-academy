# .github/workflows/ci.yml — full gated pipeline for storefront-api,
# assembled from this course's own chapters:
#   Ch.2 Lesson 5  -> workflow basics (trigger/jobs/steps)
#   Ch.2 Lesson 8  -> secrets vs. variables
#   Ch.2 Lesson 9  -> caching dependencies
#   Ch.4 Lesson 16 -> automated testing
#   Ch.4 Lesson 17 -> static analysis/linting
#   Ch.4 Lesson 18 -> coverage quality gate
#   Ch.4 Lesson 19 -> multi-stage container build
#   Ch.4 Lesson 20 -> pushing to a registry (artifact repository)
#
# Copy this into .github/workflows/ and adjust the app-specific commands
# (npm/pytest/etc.) to match your own project's language and test runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run tests with coverage (quality gate: fail under 80%)
        run: pytest --cov=src --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/

  build-image:
    name: Build & push container image
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (immutable, commit-SHA tag)
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
          docker build -t ghcr.io/${{ github.repository }}:latest .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest

# Branch protection (Settings -> Branches) should require test, lint, and
# build-image as required status checks before a PR into main can merge.
