# ---------------------------------------------------------------------------
# alertmanager.yml -- Northbridge Retail's Alertmanager config (Chapter 4,
# Lesson 19). Receives firing alerts pushed from the Prometheus server (see
# prometheus-alerting-rules.yml in this same resource), then groups,
# deduplicates, and routes them to the right destination.
# ---------------------------------------------------------------------------

global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/REPLACE/WITH/REAL_WEBHOOK"

# Templates control how an alert renders in Slack/PagerDuty -- kept in a
# separate file so this config stays focused on routing.
templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  # Default destination for anything that doesn't match a more specific
  # route below.
  receiver: default-slack
  group_by: ["alertname", "team"]
  group_wait: 30s        # wait this long after the first alert in a group fires, to catch siblings
  group_interval: 5m     # minimum time between sending updated notifications for an existing group
  repeat_interval: 4h    # re-send an unresolved alert's notification at most this often

  routes:
    # Critical checkout alerts page the on-call engineer -- everything else
    # in #alerts is triage-when-you-get-to-it, not a page.
    - match:
        team: checkout
        severity: critical
      receiver: checkout-pagerduty
      continue: false

    # Error-budget burn-rate alerts (see prometheus-alerting-rules.yml) get
    # their own Slack channel -- they're a signal to slow down on risky
    # deploys, not an immediate page.
    - match:
        team: checkout
        severity: warning
        alert_class: error_budget
      receiver: checkout-slo-slack

    # Infrastructure/platform-team alerts route separately from
    # application-team alerts.
    - match:
        team: platform
      receiver: platform-pagerduty

receivers:
  - name: default-slack
    slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"

  - name: checkout-pagerduty
    pagerduty_configs:
      - service_key: "REPLACE_WITH_REAL_PAGERDUTY_SERVICE_KEY"
        send_resolved: true
        description: "{{ .CommonAnnotations.summary }}"

  - name: checkout-slo-slack
    slack_configs:
      - channel: "#checkout-slo"
        send_resolved: true
        title: "Error budget alert: {{ .CommonLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"

  - name: platform-pagerduty
    pagerduty_configs:
      - service_key: "REPLACE_WITH_REAL_PAGERDUTY_SERVICE_KEY"
        send_resolved: true

# inhibit_rules suppress a lower-priority alert when a related, higher-
# priority one is already firing -- e.g. don't page separately for
# "CheckoutHighLatency" when "CheckoutServiceDown" already covers it.
inhibit_rules:
  - source_matchers:
      - severity="critical"
      - alertname="CheckoutServiceDown"
    target_matchers:
      - team="checkout"
    equal: ["team"]

# A silence is created at runtime (via the Alertmanager UI or amtool), not
# declared here -- e.g. during a planned deploy:
#   amtool silence add alertname="CheckoutHighErrorRate" team="checkout" \
#     --duration="30m" --comment="Planned checkout deploy, 2026-10-20 14:00 UTC"
