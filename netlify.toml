[build]
  command = "npm run build"
  # next.config.ts sets output: "export" — the build always writes a
  # fully static site to out/, so publish it directly. No plugin is
  # needed (or wanted): @netlify/plugin-nextjs's job is packaging
  # Next's SSR/ISR routes into a Lambda, and that's exactly what
  # blew past AWS Lambda's 250MB limit and failed the Chapter 10/11
  # deploys — see the comment in next.config.ts for the full story.
  # A plain static publish sidesteps function packaging entirely.
  publish = "out"
