[build]
  # Without the first two steps, Prisma's own `postinstall` hook already ran
  # `prisma generate` against the DEFAULT schema (prisma/schema.prisma,
  # provider = "sqlite") during `npm install` — so `next build` alone would
  # ship a SQLite-bound @prisma/client in the deployed functions, which
  # fails against the real Postgres DATABASE_URL set in Netlify's env vars.
  # prisma:postgres regenerates schema.production.prisma (provider =
  # "postgresql", otherwise identical — see scripts/generate-production-schema.js)
  # and the explicit `prisma generate --schema=...` re-generates the client
  # against THAT schema, overwriting the SQLite-bound one before the app
  # that imports it gets bundled.
  command = "npm run prisma:postgres && npx prisma generate --schema=prisma/schema.production.prisma && npm run build"
  # next.config.ts sets output: "export" — the build always writes a
  # fully static site to out/, so publish it directly. No plugin is
  # needed (or wanted): @netlify/plugin-nextjs's job is packaging
  # Next's SSR/ISR routes into a Lambda, and that's exactly what
  # blew past AWS Lambda's 250MB limit and failed the Chapter 10/11
  # deploys — see the comment in next.config.ts for the full story.
  # A plain static publish sidesteps function packaging entirely.
  publish = "out"

[build.environment]
  # NODE_ENV=production is set in Netlify's own env vars (needed elsewhere,
  # e.g. Prisma binaryTargets selection) and that same NODE_ENV also governs
  # `npm install`: npm skips devDependencies whenever it's "production".
  # @tailwindcss/postcss, tailwindcss, and typescript all live in
  # devDependencies but are required to run `next build` itself — without
  # this flag the install silently drops them and the build fails with
  # "Cannot find module '@tailwindcss/postcss'". This forces npm to install
  # devDependencies regardless of NODE_ENV, during the build step only.
  NPM_FLAGS = "--include=dev"
  # `next build` was getting OOM-killed (exit 137, bare "Killed", no JS heap
  # error) even after capping static-gen workers to 1 (next.config.ts) — so
  # it wasn't worker parallelism, it's memory growing inside a single
  # process past what this build sandbox actually has. In a container, V8
  # sizes its default heap ceiling off the host's total memory, not the
  # container's real cap, so it can let the heap balloon well past the
  # sandbox's limit before ever hitting its own "heap out of memory" error —
  # the OS kills the process first. Capping it explicitly below the real
  # ceiling forces GC to kick in earlier instead.
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  # Prisma's generated client ships a native query-engine binary
  # (node_modules/.prisma/client/query_engine-*.dll.node — 20MB+). esbuild's
  # default single-file bundling doesn't carry it along, so Netlify instead
  # COPIES it per-function into .netlify/functions-serve/<fn>/... — and on
  # this Windows machine, two functions copying that same 20MB+ source file
  # at once intermittently hits EBUSY (most likely real-time antivirus
  # scanning the file on first access), which can crash netlify dev
  # entirely. external_node_modules avoids the copy altogether: the module
  # is required from the existing root node_modules at runtime instead of
  # being bundled/copied, so there's nothing to race on.
  external_node_modules = ["@prisma/client", ".prisma/client"]

